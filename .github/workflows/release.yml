name: Release plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            # runner_labels: optional self-hosted label set used only when
            # USE_SELF_HOSTED is explicitly true; 'null' uses the hosted runner.
            runner_labels: '["self-hosted","macOS","ARM64"]'
          - target: macos-x64
            runner: macos-15-intel
            runner_labels: 'null'
          - target: windows-x64
            runner: windows-2022
            runner_labels: '["self-hosted","Windows","X64"]'
          - target: linux-x64
            runner: ubuntu-22.04
            runner_labels: 'null'
    # Use GitHub-hosted runners unless USE_SELF_HOSTED is explicitly enabled.
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON(matrix.runner_labels) || matrix.runner }}
    env:
      PRISM_PLATFORM: ${{ matrix.target }}
      # The lockfile pins every tarball to registry.npmjs.org. npm would
      # otherwise rewrite those hosts to the configured registry, and the
      # npmmirror CDN currently 404s on @rokid-prism SDK tarballs.
      npm_config_replace_registry_host: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Require a reproducible SDK lockfile
        shell: bash
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Test full suites on Linux and Apple silicon
        if: matrix.target == 'linux-x64' || matrix.target == 'macos-arm64'
        run: |
          npm test
      - name: Test non-PTY suites on Intel macOS
        if: matrix.target == 'macos-x64'
        run: >-
          node --test
          dist/test/adapter.test.js
          dist/test/claude-session-ownership.test.js
          dist/test/managed-adapter.test.js
          dist/test/managed-hook-outbox.test.js
          dist/test/managed-input-arbiter.test.js
          dist/test/managed-pty-broker.test.js
          dist/test/managed-supervisor.test.js
      - name: Test adapter suite on Windows
        if: matrix.target == 'windows-x64'
        run: node --test dist/test/adapter.test.js
      - name: Test Claude session ownership suite on Windows
        if: matrix.target == 'windows-x64'
        run: node --test dist/test/claude-session-ownership.test.js
      - name: Verify manifest and release version
        shell: bash
        run: node scripts/verify-release.mjs
      - name: Protocol probe on the target runner
        run: node scripts/probe.mjs
      - name: Native PTY probe on the target runner
        if: matrix.target != 'windows-x64'
        run: node scripts/probe-pty.mjs
      - name: Keep only runtime dependencies
        run: npm prune --omit=dev
      - name: Stage target package
        shell: bash
        run: |
          node scripts/stage-release.mjs
          plugin_id=$(node -e "console.log(require('fs').readFileSync('pluginbridge-plugin.yaml','utf8').match(/^id:\\s*(.+)$/m)[1].trim())")
          version=$(node -e "console.log(require('fs').readFileSync('pluginbridge-plugin.yaml','utf8').match(/^version:\\s*(.+)$/m)[1].trim())")
          tar -C "release/${plugin_id}-${version}-${PRISM_PLATFORM}" -czf "$PWD/release/${plugin_id}-${version}-${PRISM_PLATFORM}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate checked release metadata
        run: node scripts/create-release-metadata.mjs release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A moved tag or a rerun must rebuild the release instead of failing
        # on the stale one; the artifacts are regenerated either way.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
