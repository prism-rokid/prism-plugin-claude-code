id: claudecode
schema_version: 1
display_name: Claude Code
description: Connects Prism conversations to Claude Code through SDK or a managed native Terminal.
icon_url: https://registry.npmmirror.com/@lobehub/icons-static-avatar/latest/files/avatars/claudecode.webp
icon_svg_url: https://registry.npmmirror.com/@lobehub/icons-static-svg/latest/files/icons/claudecode.svg
version: 0.2.3
plugin_protocol_version: "4"
min_hub_version: 0.1.0
integration_mode: protocol-native
transport: process
runtime_modes: [sdk, managed]
default_runtime_mode: sdk
managed_terminal_modes: [managed]
runtime_controls:
  sdk: {}
  managed: {}
runtime_operations:
  sdk:
    rename: unsupported
    pin: unsupported
    archive: unsupported
    delete: unsupported
  managed:
    rename: unsupported
    pin: unsupported
    archive: unsupported
    delete: unsupported
managed_launch: true
runtime_dependencies:
  node: ">=22.0.0 <23.0.0"
command: ["${runtime.node}", "--max-old-space-size=512", "dist/index.js"]
capabilities:
  native_visible_input: false
  native_visible_output: false
  can_attach_session: true
  can_start_session_with_message: true
  can_open_draft: true
  can_list_sessions: true
  can_read_history: true
  can_interrupt: true
  can_approval: true
  can_forward_sync: true
  can_reverse_sync: false
  can_plugin_wide_watch: false
  can_wait_run: true
  can_read_status: true
  can_control_session: true
  can_open_managed_terminal: true
